name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Force Accept All Android Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n893a6ce539dba9e8bfd74c75e015073111f78af1\n24333f1a63b6b1211de43a9d906300a9f9bb1f44\xd56f5187479451eabf01fb74314b1995194d346d\n2744d159b35858f1857c0412b6f12f114a34ea48\n601085b94cd77f6b54b78cf0de23c124e532a27f\nc36c7b21de32df0a41116a881a62a9d758b1d289\n1194f15b34d75a3a77af2934b3559195e7c4e107" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\ne9ac30531ff22e7b9b7ceee2e662122ff5e79945" > $ANDROID_HOME/licenses/google-tv-license
          echo -e "\n6592d133474b63339733a925a94e1d61b126be1b" > $ANDROID_HOME/licenses/android-googletv-license

      - name: Sync Capacitor to Android
        run: bunx cap sync android

      - name: Auto-Generate Missing App Resources
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/mipmap-mdpi
          
          # Generate base string resources if missing
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Lakeview App</string><string name="title_activity_main">MainActivity</string></resources>' > android/app/src/main/res/values/strings.xml
          
          # Generate base styling resources if missing
          echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar"/><style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar"/></resources>' > android/app/src/main/res/values/styles.xml
          
          # Generate empty xml provider paths if missing
          echo '<?xml version="1.0" encoding="utf-8"?><paths><external-path name="external_files" path="."/></paths>' > android/app/src/main/res/xml/file_paths.xml
          
          # Download generic fallback icons to clear structural compiler checks
          curl -s -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png https://githubusercontent.com
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

      - name: Fix AndroidX Property Roadblock
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: society-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
