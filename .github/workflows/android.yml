name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Bun Tooling
        uses: oven-sh/setup-bun@v1

      - name: Install Web Project Dependencies
        run: bun install

      - name: Compile Distributable Web App
        run: bun run build

      - name: Setup Java JDK 21 Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Force Accept All Android Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n893a6ce539dba9e8bfd74c75e015073111f78af1\n24333f1a63b6b1211de43a9d906300a9f9bb1f44\xd56f5187479451eabf01fb74314b1995194d346d\n2744d159b35858f1857c0412b6f12f114a34ea48\n601085b94cd77f6b54b78cf0de23c124e532a27f\nc36c7b21de32df0a41116a881a62a9d758b1d289\n1194f15b34d75a3a77af2934b3559195e7c4e107" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\ne9ac30531ff22e7b9b7ceee2e662122ff5e79945" > $ANDROID_HOME/licenses/google-tv-license
          echo -e "\n6592d133474b63339733a925a94e1d61b126be1b" > $ANDROID_HOME/licenses/android-googletv-license

      - name: Safely Initialize Android Platform Structure
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor Web Assets to Native Container
        run: bunx cap sync android

      - name: Auto-Generate Missing Structural App Resources
        run: |
          # Force create parent directories safely layer by layer
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          # Inject foundational string files if missing
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Lakeview App</string><string name="title_activity_main">MainActivity</string></resources>' > android/app/src/main/res/values/strings.xml
          
          # Inject fundamental styling maps if missing
          echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar"/><style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar"/></resources>' > android/app/src/main/res/values/styles.xml
          
          # Inject XML system path mappings if missing
          echo '<?xml version="1.0" encoding="utf-8"?><paths><external-path name="external_files" path="."/></paths>' > android/app/src/main/res/xml/file_paths.xml
          
          # Stream down placeholder icon assets to satisfy compiler validation checks
          curl -s -L -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png https://githubusercontent.com
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Tweak AndroidX Global Property Flags
        run: |
          touch android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Run Native Gradle Compiler to Output APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Archive and Upload Finished App Package
        uses: actions/upload-artifact@v4
        with:
          name: society-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
