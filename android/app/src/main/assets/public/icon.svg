<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with Safe Margin for PWA Maskable / Adaptive icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle circular grid / radar ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />

  <!-- Apartment Tower Silhouette -->
  <!-- Wing C Left Tower -->
  <rect x="130" y="170" width="80" height="200" rx="8" fill="#334155" opacity="0.9"/>
  <rect x="145" y="190" width="18" height="18" rx="3" fill="#64748b"/>
  <rect x="175" y="190" width="18" height="18" rx="3" fill="#64748b"/>
  <rect x="145" y="225" width="18" height="18" rx="3" fill="#64748b"/>
  <rect x="175" y="225" width="18" height="18" rx="3" fill="#38bdf8"/>
  <rect x="145" y="260" width="18" height="18" rx="3" fill="#64748b"/>
