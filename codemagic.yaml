workflows:
  capacitor-android-build:
    name: Build Android APK
    max_build_duration: 15
    instance_type: mac_mini_m1
    environment:
      node: 22
      java: 17
    triggering:
      events:
        - push
    scripts:
      - name: Install Bun Tooling
        script: curl -fsSL https://bun.sh | bash && export PATH="$HOME/.bun/bin:$PATH"
      - name: Install Project Dependencies
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install
      - name: Compile Distributable Web App
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run build
      - name: Sync Capacitor Web Assets to Native Container
        script: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx cap sync android
      - name: Tweak AndroidX Global Property Flags
        script: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
      - name: Run Native Gradle Compiler to Output APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
