workflows:
  capacitor-android-build:
    name: Build Android APK
    max_build_duration: 15
    instance_type: mac_mini_m1
    environment:
      node: 22
      java: 21
    triggering:
      events:
        - push
    scripts:
      - name: Install Project Dependencies
        script: npm install
      - name: Compile Distributable Web App
        script: npm run build
      - name: Sync Capacitor Web Assets to Native Container
        script: npx cap sync android
      - name: Auto-Generate Missing Structural App Resources
        script: |
          # Create missing folder directories layer by layer securely
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          # Inject foundational string files if missing
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Lakeview App</string><string name="title_activity_main">MainActivity</string></resources>' > android/app/src/main/res/values/strings.xml
          
          # Inject fundamental styling maps if missing
          echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar"/><style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar"/></resources>' > android/app/src/main/res/values/styles.xml
          
          # Inject XML system path mappings if missing
          echo '<?xml version="1.0" encoding="utf-8"?><paths><external-path name="external_files" path="."/></paths>' > android/app/src/main/res/xml/file_paths.xml
          
          # Generate empty placeholder icons to satisfy structural layout compiler checks across all buckets
          touch android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          touch android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          touch android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          touch android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          touch android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          touch android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          touch android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          touch android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          touch android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          touch android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
      - name: Tweak AndroidX Global Property Flags
        script: |
          mkdir -p android
          touch android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
      - name: Run Native Gradle Compiler to Output APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
